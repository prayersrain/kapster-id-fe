<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi kapster sedang melayani customer</title>
  <desc id="desc">Ilustrasi vektor interior barbershop gelap dengan kapster sedang memotong rambut customer.</desc>
  <defs>
