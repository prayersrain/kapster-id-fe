    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9a277"/><stop offset="1" stop-color="#8d5b3f"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#232323"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b4930"/><stop offset="1" stop-color="#2a1d15"/></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#ffd58a" stop-opacity=".95"/><stop offset="1" stop-color="#d8943d" stop-opacity="0"/></radialGradient>
